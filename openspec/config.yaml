schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  App: guardería (daycare) para personal y familias.
  Objetivo: que el personal publique novedades del día (texto + foto) de los
  niños a los que tiene asignados, y que cada padre vea solo lo de su hijo.
  Roles: staff (publica) y parent (solo lectura de sus hijos).
  Tech stack: Next.js 16 App Router, TypeScript, Tailwind v4, Supabase
  (Postgres + RLS + Auth + Storage). Sin tests; se valida con lint, tsc y build.

